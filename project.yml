name: CodeProjectBackup
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
targets:
  CodeProjectBackup:
    type: application
    platform: macOS
    sources:
      - path: CodeProjectBackup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.CodeProjectBackup
        PRODUCT_NAME: CodeProjectBackup
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Info.plist
      properties:
        CFBundleName: Code Project Backup
        CFBundleDisplayName: Code Project Backup
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIdentifier: com.local.CodeProjectBackup
        CFBundleExecutable: CodeProjectBackup
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
